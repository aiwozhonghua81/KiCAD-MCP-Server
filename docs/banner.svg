    <text x="60" y="118" font-size="52" font-weight="700" fill="#ffffff" letter-spacing="0.5">KiCAD MCP Server</text>
    <text x="60" y="186" font-size="23" fill="#9fb3c8">让 Claude 等大模型通过 Model Context Protocol 直接操作 KiCAD，画原理图、布 PCB。Fork 自</text><text x="60" y="222" font-size="23" fill="#9fb3c8">mixelpixx/KiCAD-MCP-Server</text>
    <g><rect x="60" y="258" width="106" height="38" rx="19.0" fill="#ffffff" fill-opacity="0.10" stroke="#0ea5e9" stroke-opacity="0.55"/><text x="82" y="283" font-size="19" fill="#e2e8f0">KiCAD</text></g><g><rect x="180.13" y="258" width="83" height="38" rx="19.0" fill="#ffffff" fill-opacity="0.10" stroke="#0ea5e9" stroke-opacity="0.55"/><text x="202.13" y="283" font-size="19" fill="#e2e8f0">MCP</text></g><g><rect x="276.89" y="258" width="138" height="38" rx="19.0" fill="#ffffff" fill-opacity="0.10" stroke="#0ea5e9" stroke-opacity="0.55"/><text x="298.89" y="283" font-size="19" fill="#e2e8f0">244 个工具</text></g>
  </g>
  <text x="1160" y="286" font-size="16" fill="#64748b" text-anchor="end" font-family="system-ui, sans-serif">aiwozhonghua81 / KiCAD-MCP-Server</text>
